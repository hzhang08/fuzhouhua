<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>My Website</title>
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    

</head>
<body>
    <div class="container" id="main-container">
        <div class="row">
            <div class="col-3"></div>
            <div class="col-6">
                <div class="row w-25">
                    <img class="img-fluid" src="fuzhouhua.png">
                </div>
                <div class="row bg-light align-items-center border border-5 border-warning">
                    <div class="input-group">
                        <input type="text" placeholder="Search" class="form-control" id="searchbox">
                        <div class="input-group-append">
                            <button class="btn btn-outline-secondary" @click="search">搜索</button>
                        </div>
                    </div>
                </div>
                <div class="card" v-show="player">
                    <div class="row mt-3 card-body">
                        <div class="ratio ratio-21x9">
                            <!-- 1. The <iframe> (and video player) will replace this <div> tag. -->
                            <div id="player"></div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="#" class="btn btn-primary" @click="previous"><i class="bi-caret-left" style="font-size: 1rem; color: white;"></i></a>
                        <!--replay button-->
                        <a href="#" class="btn btn-primary" @click="replay"><i class="bi-arrow-clockwise" style="font-size: 1rem; color: white;"></i></a>
                        <!--Pause/resume without restarting the current clip.-->
                        <button type="button" class="btn btn-primary" @click="togglePlayback" :disabled="!playerReady" :aria-label="isPaused ? 'Resume playback' : 'Pause playback'" :title="isPaused ? 'Resume playback' : 'Pause playback'">
                            <i :class="isPaused ? 'bi-play-fill' : 'bi-pause'" style="font-size: 1rem; color: white;" aria-hidden="true"></i>
                            {{ isPaused ? 'Resume' : 'Pause' }}
                        </button>
                        <a href="#" class="btn btn-primary" @click="next"><i class="bi-caret-right" style="font-size: 1rem; color: white;"></i></a>
                    </div>
                </div>
                <div class="d-flex p-2 mt-3 fs-3 border border-5 border-warning" v-if="subtitleHtml" v-html="subtitleHtml"></div>
            </div>
            <div class="col-3"></div>
        </div>
    </div>

    <script type="text/javascript" src="js/search.js"></script>
</body>
</html>
